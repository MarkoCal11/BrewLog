spring:
  application:
    name: brewlogapp

  config:
    import: optional:file:.env[.properties]

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        auto_quote_keyword: true
        format_sql: true
        jdbc:
          batch_size: 30
          default_batch_fetch_size: 16
    open-in-view: false
    show-sql: false

  datasource:
    url: jdbc:h2:file:./data/brewlogdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    max-swallow-size: -1

jwt:
  base64-secret: ${JWT_SECRET}
  cookie-secure: false
  cookie-same-site: Strict

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin:
    username: admin
    email: admin@brewlog.com
    password: ${ADMIN_PASSWORD:}